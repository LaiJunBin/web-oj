# INTERNAL monitoring stack — not hardened for public exposure. Ports are bound
# to 127.0.0.1, Grafana defaults to admin/admin (set GRAFANA_ADMIN_PASSWORD),
# and cAdvisor runs privileged with host mounts. Run this only on a trusted
# host/network; never publish these ports to the internet.
services:
  # Overlay on the MAIN compose's app service: metrics must bind the container
  # interface (not its loopback) for Prometheus to scrape app:9091 across the
  # docker network. Set here so the stack works the moment it is composed in —
  # config.example.yaml deliberately keeps 127.0.0.1 for everyone NOT running
  # this overlay. Port 9091 stays unpublished on the host either way.
  app:
    environment:
      - SERVER_METRICSHOST=0.0.0.0

  loki:
    image: grafana/loki:2.9.8
    container_name: backend-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - go-app-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: backend-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - go-app-network
    restart: unless-stopped
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: backend-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - go-app-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: backend-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - go-app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    container_name: backend-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - go-app-network
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

networks:
  go-app-network:
    external: true
    name: go-app-network

volumes:
  loki-data:
  prometheus-data:
  grafana-storage:
