# INTERNAL code-analysis stack — not hardened for public exposure. Ports are
# bound to 127.0.0.1 and it ships with default credentials (SonarQube admin/admin,
# DB sonar/sonar). Change them and keep this on a trusted host/network; never
# publish :9000 to the internet.
services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      - sonar-postgres
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "127.0.0.1:9000:9000"
  sonar-postgres:
    image: postgres:12
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar

