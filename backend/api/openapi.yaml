components:
  schemas:
    Admin.BuildSpec.Build:
      type: object
      required:
        - batch
        - status
        - logs
      properties:
        batch:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/Admin.BuildSpec.BuildStatus'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Admin.BuildSpec.Log'
    Admin.BuildSpec.BuildInfo:
      type: object
      required:
        - batch
        - status
      properties:
        batch:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/Admin.BuildSpec.BuildStatus'
    Admin.BuildSpec.BuildStatus:
      type: string
      enum:
        - PENDING
        - BUILDING
        - ERROR
        - SUCCESS
        - CANCELLED
    Admin.BuildSpec.Log:
      type: object
      required:
        - level
        - message
        - time
      properties:
        level:
          type: string
        message:
          type: string
        time:
          type: string
          format: date-time
    Admin.BundleSpec.BundleContestItem:
      type: object
      required:
        - name
        - projectSlots
        - unresolvedProjects
      properties:
        name:
          type: string
        projectSlots:
          type: integer
          format: int32
          description: 競賽的題目 slot 數
        unresolvedProjects:
          type: array
          items:
            type: string
          description: 對不到題庫的 slot（匯出檔內的題目也算數，匯入時會先建立）
    Admin.BundleSpec.BundleImageItem:
      type: object
      required:
        - tag
        - mode
        - status
        - usedByProjects
      properties:
        tag:
          type: string
        mode:
          type: string
        status:
          $ref: '#/components/schemas/Admin.BundleSpec.BundleItemStatus'
        usedByProjects:
          type: array
          items:
            type: string
          description: 覆蓋這個映像會連帶影響的題目名稱。空陣列代表沒有題目在用它
    Admin.BundleSpec.BundleImportReport:
      type: object
      required:
        - createdImages
        - reusedImages
        - queuedBuilds
        - createdProjectIds
        - contestId
        - unresolvedProjects
        - warnings
      properties:
        createdImages:
          type: array
          items:
            type: string
        reusedImages:
          type: array
          items:
            type: string
        queuedBuilds:
          type: array
          items:
            type: string
          description: 已排入建置的映像 tag。source 模式需要建置，archive 模式不需要
        createdProjectIds:
          type: array
          items:
            type: integer
            format: int32
        contestId:
          type: integer
          format: int32
          nullable: true
        unresolvedProjects:
          type: array
          items:
            type: string
          description: 競賽中對不到題目的 slot，這些沒有建立
        warnings:
          type: array
          items:
            type: string
          description: |-
            僅承載匯入成功時的非致命提醒（目前恆為空）。中途失敗不會出現在這裡：
            那會以 500 回報，details 列出失敗原因與已建立的項目，由操作者自行
            接續完成或移除——系統不做假裝的自動回滾。
      description: 匯入結果：實際建立了什麼，以及還要做什麼。
    Admin.BundleSpec.BundleItemStatus:
      type: string
      enum:
        - new
        - identical
        - conflict
      description: 一個項目在匯入時會發生什麼事。
    Admin.BundleSpec.BundlePreview:
      type: object
      required:
        - formatVersion
        - images
        - projects
        - contest
        - blockers
      properties:
        formatVersion:
          type: integer
          format: int32
        images:
          type: array
          items:
            $ref: '#/components/schemas/Admin.BundleSpec.BundleImageItem'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Admin.BundleSpec.BundleProjectItem'
        contest:
          type: object
          allOf:
            - $ref: '#/components/schemas/Admin.BundleSpec.BundleContestItem'
          nullable: true
          description: 匯出檔若不含競賽則為 null
        blockers:
          type: array
          items:
            type: string
          description: |-
            阻擋匯入的原因。非空時 importBundle 以 409 拒絕;其中「同 tag 但內容
            不同」類的衝突可用 force 覆蓋,缺映像則不行(400 保留給格式不合法的
            匯出檔,那種請求到不了這份清單)。

            分開列出而不是塞進各項目裡，是因為前端要用它決定「執行」按鈕能不能按，
            而那個判斷不該是走訪三個陣列再自己推論出來的。
      description: 預覽結果：這個匯出檔會做什麼，以及有什麼擋著。
    Admin.BundleSpec.BundleProjectItem:
      type: object
      required:
        - name
        - status
        - missingImageTags
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/Admin.BundleSpec.BundleItemStatus'
        missingImageTags:
          type: array
          items:
            type: string
          description: 這個題目參照、但匯出檔與系統都沒有的映像 tag
    Admin.BundleSpec.ImportBundleRequestMultiPart:
      type: object
      required:
        - bundle
      properties:
        bundle:
          type: string
          format: binary
        force:
          type: boolean
          description: 同 tag 但內容不同的映像，強制覆蓋。未指定則該項會被列為 blocker
    Admin.BundleSpec.PreviewBundleRequestMultiPart:
      type: object
      required:
        - bundle
      properties:
        bundle:
          type: string
          format: binary
    Admin.ContestProjectSpec.ContestProject:
      type: object
      required:
        - id
        - projectId
        - name
        - description
        - startTime
        - endTime
        - activateTime
        - deactivateTime
        - isPublic
        - judgePriorityStrategy
        - maxJudgeDurationMinutes
        - submissionCooldownSeconds
        - pidsLimit
        - memoryLimitMB
        - scoreboardCompact
        - scoreboardMaskNames
      properties:
        id:
          type: integer
          format: int32
        projectId:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        image:
          type: string
        testImage:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        activateTime:
          type: string
          format: date-time
        deactivateTime:
          type: string
          format: date-time
        isPublic:
          type: boolean
        judgePriorityStrategy:
          type: string
        maxJudgeDurationMinutes:
          type: integer
          format: int32
          nullable: true
        submissionCooldownSeconds:
          type: integer
          format: int32
          nullable: true
        pidsLimit:
          type: integer
          format: int32
          nullable: true
        memoryLimitMB:
          type: integer
          format: int32
          nullable: true
        scoreboardCompact:
          type: boolean
        scoreboardMaskNames:
          type: boolean
    Admin.ContestProjectSpec.JudgmentAnalytics:
