        - JUDGE_PARTIAL
        - REJUDGE
    Admin.JudgeWorkerSpec.JudgeQueueDepths:
      type: object
      required:
        - judge
        - judgePartial
        - rejudge
      properties:
        judge:
          type: integer
          format: int32
        judgePartial:
          type: integer
          format: int32
        rejudge:
          type: integer
          format: int32
      description: Judgments waiting per judge type. Every type the pipeline serves is present, including the ones at zero.
    Admin.JudgeWorkerSpec.JudgeQueueStatus:
      type: object
      required:
        - queueDepths
        - activeJudgments
        - oldestQueuedSeconds
      properties:
        queueDepths:
          $ref: '#/components/schemas/Admin.JudgeWorkerSpec.JudgeQueueDepths'
        activeJudgments:
          type: integer
          format: int32
          description: Judgments executing right now. Same number as the judge_active_judgments metric, read from the same counter.
        oldestQueuedSeconds:
          type: number
          format: double
          nullable: true
          description: How long the longest-waiting judgment has been waiting, in seconds, or null when nothing is queued. Reported instead of an average because an average absorbs a stall — one judgment stuck for ten minutes barely moves it, but shows up here immediately.
    Admin.JudgeWorkerSpec.JudgeWorker:
      type: object
      required:
        - id
        - status
        - judgeOrder
        - createdAt
        - lastExecutionAt
      properties:
        id:
