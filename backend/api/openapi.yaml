              schema:
                $ref: '#/components/schemas/Shared.APIInternalServerErrorResponse'
      security:
        - Authorization: []
          UserID: []
          PermissionRead: []
  /bundles/import:
    post:
      tags:
        - Bundles
      operationId: importBundle
      description: |-
        執行匯入。順序固定為映像 → 題目 → 競賽，因為後者參照前者。

        匯出檔內含會在評測主機上建置並執行的 Dockerfile 與指令，因此限管理員。
      parameters: []
