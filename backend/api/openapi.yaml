      type: object
      required:
        - maxJudgeDurationMinutes
        - submissionCooldownSeconds
        - pidsLimit
        - memoryLimitMB
      properties:
        maxJudgeDurationMinutes:
          type: integer
          format: int32
          description: 單場評測總時長上限（分鐘）。競賽專案的 maxJudgeDurationMinutes 留空時套用。
        submissionCooldownSeconds:
          type: integer
          format: int32
          description: 同一位選手兩次提交之間的最短間隔（秒），0 表示不限制。競賽專案的 submissionCooldownSeconds 留空時套用。
        pidsLimit:
          type: integer
          format: int32
          description: 評測容器的行程數上限（PID），0 表示不限制。競賽專案的 pidsLimit 留空時套用。
        memoryLimitMB:
          type: integer
          format: int32
          description: 評測容器的記憶體上限（MB），0 表示不限制。競賽專案的 memoryLimitMB 留空時套用。
      description: 生效中的系統預設值。競賽專案把對應欄位留空時套用的就是這些數字，管理介面用它把「未設定」呈現成具體的值。這裡是手寫的白名單，只放有逐資源覆寫的設定；不得改成自動展開伺服器設定，那會把金鑰與密碼一起帶出去。
