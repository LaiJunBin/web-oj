              schema:
                $ref: '#/components/schemas/Shared.APINotFoundResponse'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared.APIConflictResponse'
        '500':
          description: Server error
