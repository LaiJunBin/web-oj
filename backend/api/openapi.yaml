    Shared.APIBadRequestResponse:
      type: object
      required:
        - message
        - details
        - success
      properties:
        message:
          type: string
          enum:
            - Bad Request
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
    Shared.APIConflictResponse:
      type: object
      required:
        - message
        - details
        - success
      properties:
        message:
          type: string
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
      description: |-
        409。上傳的匯出檔與系統既有的東西同名，但內容不同。

        與 400 分開是因為前端要據此做不同的事：400 是「這個檔案有問題」，
        409 是「檔案沒問題，但會覆蓋既有的東西」——後者該給使用者一個明確的
        強制覆蓋選項，而不是要他去解析錯誤訊息判斷。

        details 逐條說明衝突，並列出受影響的範圍（例如哪些題目正在使用這個映像）。
        刻意不放進下面的 alias：只有匯入類 operation 會遇到。
    Shared.APIForbiddenResponse:
      type: object
      required:
        - message
        - details
        - success
      properties:
        message:
          type: string
          enum:
            - Forbidden
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
    Shared.APIInternalServerErrorResponse:
      type: object
      required:
        - message
        - details
        - success
      properties:
        message:
          type: string
          enum:
            - Internal Server Error
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
    Shared.APINotFoundResponse:
      type: object
      required:
        - message
        - details
        - success
      properties:
        message:
          type: string
          enum:
            - Not Found
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
    Shared.APINotImplementedResponse:
      type: object
      required:
        - message
        - details
        - success
      properties:
        message:
          type: string
          enum:
            - Not Implemented
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
    Shared.APITooManyRequestsResponse:
      type: object
      required:
        - message
        - details
        - success
        - retryAfterSeconds
      properties:
        message:
          type: string
        details:
          type: array
          items:
            type: string
        success:
          type: boolean
          default: false
        retryAfterSeconds:
          type: integer
          format: int32
          description: 還要等幾秒才能再次操作
      description: |-
        429。與其他錯誤回應多一個 retryAfterSeconds，讓前端能顯示倒數而不必解析訊息字串。
        刻意不放進下面的 alias：只有真的有頻率限制的 operation 才該宣告它。
    Shared.APIUnauthorizedResponse:
