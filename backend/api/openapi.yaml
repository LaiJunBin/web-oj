  /bundles/export/contests/{id}:
    get:
      tags:
        - Bundles
      operationId: exportBundle
      description: |-
        匯出整場競賽（.zip）：一場競賽、它的所有題目、以及這些題目參照的映像。

        mode 決定映像以哪種形態隨行：source 是建置原始檔（KB 級，匯入端要建置、
        要能連外拉 base image）；archive 是 docker save 的映像檔（可能數百 MB，
        匯入端不需網路也不需建置，適合離線考場）。archive 需要所有映像都已建置
        完成，否則回 400 並列出還沒建置的 tag。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum:
              - source
              - archive
      responses:
        '200':
          description: The request has succeeded.
          headers:
            content-disposition:
              required: true
              schema:
                type: string
                enum:
                  - attachment; filename=file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared.APIBadRequestResponse'
        '401':
