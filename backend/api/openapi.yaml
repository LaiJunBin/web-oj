          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared.APIBadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared.APIUnauthorizedResponse'
        '403':
          description: Access is forbidden
          content:
            application/json:
              schema:
